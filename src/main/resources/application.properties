spring.application.name=AssetPilot-backend

server.port=8080

# ========== MySQL ==========
spring.datasource.url=jdbc:mysql://localhost:3306/assetpilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2002
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA ==========
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ========== Flyway ==========
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ========== Redis (cache) ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple

# ========== JWT (validite 24h = 86400000 ms) ==========
app.jwt.secret=CHANGE_ME_TO_A_SECURE_SECRET_KEY_WITH_AT_LEAST_32_BYTES_1234567890
app.jwt.expiration=86400000

# ========== Springdoc / Swagger ==========
springdoc.swagger-ui.path=/swagger-ui.html

# ========== Logs ==========
logging.level.org.hibernate.SQL=debug